<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#101a44"/>
      <stop offset="55%" stop-color="#070a1a"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>

    <!-- Reduced bloom behind text (static) -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon stroke gradient -->
    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d7bff"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#9d7bff"/>
    </linearGradient>

    <!-- Text fill gradient -->
    <linearGradient id="neonFill" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f5f1ff"/>
      <stop offset="50%" stop-color="#d8fbff"/>
      <stop offset="100%" stop-color="#f5f1ff"/>
    </linearGradient>

    <!-- Soft glow filter (static) -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="9" in="b1" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <rect y="0" width="6" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>

    <!-- Sparkle -->
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-9 L1.6-1.6 L9 0 L1.6 1.6 L0 9 L-1.6 1.6 L-9 0 L-1.6-1.6 Z"
            fill="#ffffff" opacity="0.8"/>
    </symbol>

    <!-- Static shimmer overlay (no animation) -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <mask id="shimmerMask">
      <!-- Fixed sweeping band positioned for a tasteful highlight -->
      <rect x="520" y="0" width="320" height="1024" fill="url(#shimmerGrad)"/>
    </mask>

    <!-- Rounded icon clip -->
    <clipPath id="roundClip">
      <rect x="32" y="32" width="960" height="960" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Subtle bloom -->
    <circle cx="512" cy="520" r="360" fill="url(#bloom)"/>

    <!-- Ambient floating glows (static) -->
    <g opacity="0.6">
      <circle cx="240" cy="330" r="110" fill="#7c5cff" opacity="0.08"/>
      <circle cx="810" cy="440" r="140" fill="#00e5ff" opacity="0.07"/>
      <circle cx="520" cy="820" r="160" fill="#7c5cff" opacity="0.06"/>
    </g>

    <!-- Sparkles (static) -->
    <g opacity="0.7">
      <use href="#spark" x="160" y="170" width="16" height="16"/>
      <use href="#spark" x="880" y="210" width="12" height="12"/>
      <use href="#spark" x="780" y="850" width="18" height="18"/>
      <use href="#spark" x="260" y="860" width="10" height="10"/>
      <use href="#spark" x="540" y="145" width="10" height="10" opacity="0.55"/>
    </g>

    <!-- Logo text -->
    <g filter="url(#glow)">
      <text x="512" y="540"
            text-anchor="middle"
            font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
            font-weight="800"
            font-size="96"
            letter-spacing="1.5"
            fill="url(#neonFill)"
            stroke="url(#neonStroke)"
            stroke-width="5"
            paint-order="stroke fill">
        LogoScreenSaver
      </text>

      <!-- Inner highlight -->
      <text x="512" y="540"
            text-anchor="middle"
            font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
            font-weight="800"
            font-size="96"
            letter-spacing="1.5"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.45"
            stroke-width="1.2">
        LogoScreenSaver
      </text>
    </g>

    <!-- Static shimmer pass -->
    <g mask="url(#shimmerMask)" opacity="0.35">
      <text x="512" y="540"
            text-anchor="middle"
            font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
            font-weight="800"
            font-size="96"
            letter-spacing="1.5"
            fill="#ffffff">
        LogoScreenSaver
      </text>
    </g>

    <!-- Scanlines -->
    <rect width="1024" height="1024" fill="url(#scanlines)" opacity="0.6"/>

    <!-- Vignette -->
    <rect width="1024" height="1024" fill="url(#vignette)"/>
  </g>

  <!-- Subtle rounded border -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>

