name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Generate BuildInfo.swift
        run: ./Scripts/generate-build-info.sh

      - name: Swift Build (SPM)
        run: swift build

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Swift Test (SPM)
        run: swift test

      - name: Build LogoScreenSaver.saver (Xcode)
        run: |
          xcodebuild build \
            -project LogoScreenSaver.xcodeproj \
            -scheme LogoScreenSaver \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build LogoScreenSaverApp.app (Xcode)
        run: |
          xcodebuild build \
            -project LogoScreenSaver.xcodeproj \
            -scheme LogoScreenSaverApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
